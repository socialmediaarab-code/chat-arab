<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات العرب</title>
    <!-- مكتبة الإيموجي -->
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.4/dist/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e3c72; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; background: #fff; border-left: 1px solid #ddd; padding: 15px; overflow-y: auto; }
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #fafafa; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .input-box { padding: 10px 15px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        button, .icon-btn { padding: 9px 15px; background: #1e3c72; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        button:hover, .icon-btn:hover { background: #2a5298; }
        .user-item { padding: 8px 12px; margin-bottom: 5px; background: #eef2f5; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .user-item:hover { background: #dce4ec; }
        .msg { background: #fff; padding: 10px 14px; border-radius: 8px; max-width: 70%; border: 1px solid #eee; word-break: break-word; }
        .msg.me { align-self: flex-end; background: #dcf8c6; }
        .chat-img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 5px; display: block; }

        /* نافذة الخاص المنبثقة */
        #private-chat-modal { display: none; position: fixed; top: 100px; left: 100px; width: 350px; background: #fff; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; overflow: hidden; }
        #private-modal-header { background: #1e3c72; color: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
    </style>
</head>
<body>

    <header>
        <h2>شات العرب</h2>
        <div id="pm-notification-btn" style="position: relative; cursor: pointer; font-size: 15px;">
            <span>✉️ الرسائل الخاصّة</span>
            <span id="pm-badge" style="display: none; position: absolute; top: -8px; right: -12px; background: red; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold;">0</span>
        </div>
    </header>

    <div class="container">
        <!-- شريط المتصلين -->
        <div class="sidebar">
            <h3 style="font-size: 16px; margin-bottom: 10px;">المتصلون الآن</h3>
            <div id="users-list"></div>
        </div>

        <!-- الشات العام -->
        <div class="main-chat">
            <div class="messages-box" id="public-messages"></div>
            <div id="typing-indicator" style="font-style: italic; color: #888; height: 20px; font-size: 0.85em; padding: 0 20px;"></div>
            <div class="input-box">
                <button type="button" id="emoji-btn" class="icon-btn" style="background: #f0f0f0; color: #333;">😀</button>
                <label for="public-file-input" class="icon-btn" style="cursor: pointer;">📷</label>
                <input type="file" id="public-file-input" accept="image/*" style="display: none;" onchange="sendPublicImage(this)" />
                <input type="text" id="public-input" placeholder="اكتب رسالتك هنا..." />
                <button type="button" onclick="sendPublicMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- نافذة الخاص المنبثقة -->
    <div id="private-chat-modal">
        <div id="private-modal-header">
            <span id="private-target-name">محادثة خاصة</span>
            <button type="button" onclick="closePrivateModal()" style="background: transparent; border: none; color: #fff; font-size: 16px; cursor: pointer;">✕</button>
        </div>
        <div id="private-messages" style="height: 250px; padding: 10px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 8px;"></div>
        
        <div style="display: flex; padding: 8px; border-top: 1px solid #eee; background: #fff; gap: 5px; align-items: center;">
            <button type="button" id="private-emoji-btn" class="icon-btn" style="background: #f0f0f0; color: #333; padding: 6px 10px;">😀</button>
            <label for="private-file-input" class="icon-btn" style="cursor: pointer; padding: 6px 10px; background: #eee; color: #333;">📷</label>
            <input type="file" id="private-file-input" accept="image/*" style="display: none;" onchange="sendPrivateImage(this)" />
            <input type="text" id="private-input" placeholder="اكتب رسالة خاصة..." style="flex: 1; border: 1px solid #ddd; padding: 8px; border-radius: 5px; outline: none; font-size: 13px;" />
            <button type="button" onclick="sendPrivateMessage()" style="padding: 8px 12px; font-size: 13px;">إرسال</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
