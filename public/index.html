<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات العرب - المحادثة الجماعية والخاصة</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #auth-screen {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 350px;
            backdrop-filter: blur(5px);
        }

        .auth-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        .google-btn { background-color: #1a4b84; border: 2px solid #f39c12; }
        .guest-btn { background-color: #0b2535; }
        .member-btn { background-color: #7ab51d; }
        .auth-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .input-form {
            display: none;
            margin-top: 15px;
            text-align: right;
        }

        .input-form input, .input-form select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .back-link {
            color: #ddd;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
            font-size: 14px;
        }

        #auth-error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* شاشة الشات */
        #chat-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #fff;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #0b2535;
            color: white;
            padding: 15px;
            overflow-y: auto;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            color: #f39c12;
        }

        .user-item {
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-item:hover { background: rgba(255,255,255,0.2); }

        .unread-badge {
            background: #ff4757;
            color: white;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
        }

        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message-bubble {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            max-width: 70%;
            word-wrap: break-word;
            background: #e2e8f0;
        }

        .message-bubble.my-msg {
            background: #dcf8c6;
            margin-right: auto;
        }

        .input-area {
            padding: 10px;
            background: #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* نافذة المحادثة الخاصة المنفصلة وقابلة للتحريك بحرية (يمين، يسار، فوق، تحت) */
        #private-chat-modal {
            display: none;
            position: fixed;
            top: 100px;
            right: 100px;
            width: 340px;
            height: 420px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            flex-direction: column;
            z-index: 1000;
        }

        .private-header {
            background: #1a4b84;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            cursor: move; /* مؤشر السحب لتوضيح إمكانية التحكم بمكان النافذة */
            user-select: none;
        }

        .private-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #f4f4f4;
            font-size: 14px;
        }

        .private-input-area {
            padding: 8px;
            background: #ddd;
            display: flex;
            gap: 5px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .private-input-area input {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen">
        <h2 style="color: white; margin-bottom: 20px;">منصة شات العرب</h2>
        
        <div id="main-auth-buttons">
            <div id="g_id_onload"
                 data-client_id="593400807452-hasied40uonfha4fh157c7vtb0tibkk4.apps.googleusercontent.com"
                 data-callback="handleGoogleSignIn"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-text="signin_with" data-size="large" data-locale="ar" style="margin-bottom: 10px; display: flex; justify-content: center;"></div>

            <button class="auth-btn guest-btn" onclick="showForm('guest')">🕵️ دخول / كضيوف</button>
            <button class="auth-btn member-btn" onclick="showForm('member')">👤 دخول الأعضاء</button>
        </div>

        <div id="guest-form" class="input-form">
            <input type="text" id="guest-name" placeholder="أدخل اسمك المستعار">
            <input type="number" id="guest-age" placeholder="العمر">
            <select id="guest-gender">
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <button class="auth-btn guest-btn" onclick="submitGuest()">دخول كزائر</button>
            <span class="back-link" onclick="goBack()">إرجاع</span>
        </div>

        <div id="google-extra-form" class="input-form">
            <p style="color: #fff; font-size: 13px;">أكمل بيانات حسابك:</p>
            <input type="text" id="google-custom-name" placeholder="الاسم في الشات">
            <input type="number" id="google-age" placeholder="العمر">
            <select id="google-gender">
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <button class="auth-btn google-btn" onclick="submitGoogleExtra()">متابعة الدخول</button>
        </div>

        <div id="member-form" class="input-form">
            <input type="email" id="auth-email" placeholder="البريد الإلكتروني">
            <input type="password" id="auth-password" placeholder="كلمة المرور">
            <input type="text" id="reg-username" placeholder="الاسم (في حال تسجيل جديد)">
            <button class="auth-btn member-btn" onclick="submitAuthForm()">دخول / تسجيل</button>
            <span class="back-link" onclick="goBack()">إرجاع</span>
        </div>

        <div id="auth-error"></div>
    </div>

    <!-- شاشة الشات الرئيسية -->
    <div id="chat-screen">
        <div style="background: #0b2535; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
            <h3>غرفة الدردشة العامة</h3>
            <div>مرحباً، <span id="current-user-display" style="font-weight: bold; color: #7ab51d;"></span> | <button onclick="location.reload()" style="background:#ff6b6b; border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">خروج</button></div>
        </div>
        <div class="chat-container">
            <!-- القائمة الجانبية: صندوق الرسائل الخاصة مع العدادات + المتواجدون -->
            <div class="sidebar">
                <div>
                    <div class="section-title">📬 الرسائل الخاصة</div>
                    <div id="private-conversations-list" style="margin-top: 8px; margin-bottom: 15px; max-height: 150px; overflow-y: auto;">
                        <span style="font-size: 12px; color: #aaa;">لا توجد رسائل خاصة حالياً</span>
                    </div>
                </div>
                <div>
                    <div class="section-title">👥 الأعضاء المتواجدون</div>
                    <div id="users-list" style="margin-top: 8px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- منطقة الرسائل العامة -->
            <div class="chat-main">
                <div id="typing-indicator" style="padding: 5px 15px; font-size: 12px; color: #666; font-style: italic;"></div>
                <div id="messages-box" class="messages-area"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="اكتب رسالتك أو ضع إيموجي هنا...">
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="sendImage(this)">
                    <button onclick="document.getElementById('image-input').click()" style="padding: 10px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer;">🖼️</button>
                    <button onclick="sendMessage()" style="padding: 10px 20px; background: #1a4b84; color: white; border: none; border-radius: 5px; cursor: pointer;">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة المحادثة الخاصة المنفصلة وقابلة للتحريك -->
    <div id="private-chat-modal">
        <div class="private-header" id="private-modal-header">
            <span id="private-target-title">محادثة خاصة</span>
            <button onclick="closePrivateModal()" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;">✖</button>
        </div>
        <div id="private-messages-box" class="private-messages"></div>
        <div class="private-input-area">
            <input type="text" id="private-message-input" placeholder="اكتب رسالة خاصة...">
            <input type="file" id="private-image-input" accept="image/*" style="display: none;" onchange="sendPrivateImage(this)">
            <button onclick="document.getElementById('private-image-input').click()" style="background:#6c757d; color:white; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">🖼️</button>
            <button onclick="sendPrivateMessage()" style="background:#1a4b84; color:white; border:none; padding:5px 12px; border-radius:4px; cursor:pointer;">إرسال</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let googlePayloadTemp = null;
        let socket;
        let activePrivateSocketId = null;
        let activePrivateUsername = '';
        let privateChatsData = {};

        // كود سحب وتحريك النافذة الخاصة (Draggable Modal) يميناً ويساراً وفوق وتحت
        const modal = document.getElementById('private-chat-modal');
        const header = document.getElementById('private-modal-header');
        let isDragging = false, startX, startY, initialX, initialY;

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialX = modal.offsetLeft;
            initialY = modal.offsetTop;
            document.addEventListener('mousemove', dragModal);
            document.addEventListener('mouseup', stopDragging);
        });

        function dragModal(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            modal.style.left = `${initialX + dx}px`;
            modal.style.top = `${initialY + dy}px`;
            modal.style.right = 'auto';
        }

        function stopDragging() {
            isDragging = false;
            document.removeEventListener('mousemove', dragModal);
            document.removeEventListener('mouseup', stopDragging);
        }

        function showForm(type) {
            document.getElementById('main-auth-buttons').style.display = 'none';
            document.getElementById('guest-form').style.display = 'none';
            document.getElementById('member-form').style.display = 'none';
            document.getElementById('google-extra-form').style.display = 'none';
            if (type === 'guest') document.getElementById('guest-form').style.display = 'block';
            if (type === 'member') document.getElementById('member-form').style.display = 'block';
        }

        function goBack() {
            document.getElementById('main-auth-buttons').style.display = 'block';
            document.getElementById('guest-form').style.display = 'none';
            document.getElementById('member-form').style.display = 'none';
            document.getElementById('google-extra-form').style.display = 'none';
            document.getElementById('auth-error').style.display = 'none';
        }

        function handleGoogleSignIn(response) {
            googlePayloadTemp = response.credential;
            document.getElementById('main-auth-buttons').style.display = 'none';
            document.getElementById('google-extra-form').style.display = 'block';
        }

        function submitGoogleExtra() {
            const name = document.getElementById('google-custom-name').value.trim();
            const age = document.getElementById('google-age').value.trim();
            const gender = document.getElementById('google-gender').value;
            const errorDiv = document.getElementById('auth-error');
            if (!name || !age) { errorDiv.innerText = 'الرجاء إدخال الاسم والعمر'; errorDiv.style.display = 'block'; return; }
            fetch('/api/google-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: googlePayloadTemp, username: name, age, gender })
            }).then(res => res.json()).then(data => {
                if (data.success) initChat(data.username);
                else { errorDiv.innerText = data.message; errorDiv.style.display = 'block'; }
            });
        }

        function submitGuest() {
            const name = document.getElementById('guest-name').value.trim();
            const age = document.getElementById('guest-age').value.trim();
            const gender = document.getElementById('guest-gender').value;
            const errorDiv = document.getElementById('auth-error');
            if (!name || !age) { errorDiv.innerText = 'الرجاء كتابة الاسم والعمر'; errorDiv.style.display = 'block'; return; }
            fetch('/api/guest-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, age, gender })
            }).then(res => res.json()).then(data => {
                if (data.success) initChat(data.username);
                else { errorDiv.innerText = data.message; errorDiv.style.display = 'block'; }
            });
        }

        function submitAuthForm() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const errorDiv = document.getElementById('auth-error');
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, username })
            }).then(res => res.json()).then(data => {
                if (data.success) initChat(data.username);
                else { errorDiv.innerText = data.message; errorDiv.style.display = 'block'; }
            });
        }

        function initChat(username) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('current-user-display').innerText = username;

            socket = io();
            socket.emit('join_room', { username, room: 'general' });

            socket.on('chat_message', (data) => {
                const box = document.getElementById('messages-box');
                let content = data.system ? `<em style="color:gray;">${data.message}</em>` : `<strong>${data.username}:</strong> ${data.message || ''}`;
                if (data.image) content += `<br><img src="${data.image}" style="max-width:200px; border-radius:5px; margin-top:5px;">`;
                box.innerHTML += `<div class="message-bubble">${content}</div>`;
                box.scrollTop = box.scrollHeight;
            });

            socket.on('receive_private_msg', (data) => {
                if (!privateChatsData[data.senderId]) {
                    privateChatsData[data.senderId] = { username: data.senderName, messages: [], unreadCount: 0 };
                }
                privateChatsData[data.senderId].messages.push({ sender: data.senderName, message: data.message, image: data.image });
                
                if (activePrivateSocketId !== data.senderId) {
                    privateChatsData[data.senderId].unreadCount += 1;
                } else {
                    appendPrivateMessageUI(data.senderName, data.message, data.image, false);
                }
                renderPrivateConversationsList();
            });

            socket.on('update_users', (users) => {
                const list = document.getElementById('users-list');
                list.innerHTML = '';
                users.forEach(u => {
                    if (u.username !== username) {
                        list.innerHTML += `<div class="user-item" onclick="openPrivateChatModal('${u.id}', '${u.username}')"><span>👤 ${u.username}</span><span style="font-size:11px; color:#aaa;">مراسلة</span></div>`;
                    }
                });
            });

            const msgInput = document.getElementById('message-input');
            msgInput.addEventListener('input', () => {
                socket.emit('typing', { room: 'general' });
                clearTimeout(window.typingTimeout);
                window.typingTimeout = setTimeout(() => socket.emit('stop_typing', { room: 'general' }), 1000);
            });

            socket.on('display_typing', (data) => {
                document.getElementById('typing-indicator').innerText = `${data.username} يكتب الآن...`;
            });
            socket.on('hide_typing', () => {
                document.getElementById('typing-indicator').innerText = '';
            });
        }

        function renderPrivateConversationsList() {
            const container = document.getElementById('private-conversations-list');
            container.innerHTML = '';
            const keys = Object.keys(privateChatsData);
            if (keys.length === 0) {
                container.innerHTML = `<span style="font-size: 12px; color: #aaa;">لا توجد رسائل خاصة حالياً</span>`;
                return;
            }
            keys.forEach(sId => {
                const chat = privateChatsData[sId];
                container.innerHTML += `
                    <div class="user-item" onclick="openPrivateChatModal('${sId}', '${chat.username}')">
                        <span>💬 ${chat.username}</span>
                        ${chat.unreadCount > 0 ? `<span class="unread-badge">${chat.unreadCount}</span>` : ''}
                    </div>
                `;
            });
        }

        function openPrivateChatModal(socketId, targetName) {
            activePrivateSocketId = socketId;
            activePrivateUsername = targetName;
            
            if (!privateChatsData[socketId]) {
                privateChatsData[socketId] = { username: targetName, messages: [], unreadCount: 0 };
            }
            privateChatsData[socketId].unreadCount = 0;
            renderPrivateConversationsList();

            document.getElementById('private-target-title').innerText = `محادثة خاصة: ${targetName}`;
            
            const pBox = document.getElementById('private-messages-box');
            pBox.innerHTML = '';
            privateChatsData[socketId].messages.forEach(m => {
                const isMyMsg = m.sender === 'أنت';
                let content = `<strong>${m.sender}:</strong> ${m.message || ''}`;
                if (m.image) content += `<br><img src="${m.image}" style="max-width:150px; border-radius:5px; margin-top:5px;">`;
                pBox.innerHTML += `<div class="message-bubble ${isMyMsg ? 'my-msg' : ''}" style="${isMyMsg ? '' : 'background:#fff; border:1px solid #ddd;'}">${content}</div>`;
            });
            pBox.scrollTop = pBox.scrollHeight;

            document.getElementById('private-chat-modal').style.display = 'flex';
        }

        function closePrivateModal() {
            document.getElementById('private-chat-modal').style.display = 'none';
            activePrivateSocketId = null;
        }

        function appendPrivateMessageUI(sender, message, image, isMine) {
            const pBox = document.getElementById('private-messages-box');
            let content = `<strong>${sender}:</strong> ${message || ''}`;
            if (image) content += `<br><img src="${image}" style="max-width:150px; border-radius:5px; margin-top:5px;">`;
            pBox.innerHTML += `<div class="message-bubble ${isMine ? 'my-msg' : ''}" style="${isMine ? '' : 'background:#fff; border:1px solid #ddd;'}">${content}</div>`;
            pBox.scrollTop = pBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('send_message', { room: 'general', message: text });
            input.value = '';
        }

        function sendImage(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send_message', { room: 'general', image: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        function sendPrivateMessage() {
            const input = document.getElementById('private-message-input');
            const text = input.value.trim();
            if (!text || !activePrivateSocketId) return;

            socket.emit('send_private_msg', { targetSocketId: activePrivateSocketId, message: text });
            
            privateChatsData[activePrivateSocketId].messages.push({ sender: 'أنت', message: text });
            appendPrivateMessageUI('أنت', text, null, true);
            
            input.value = '';
        }

        function sendPrivateImage(inputElement) {
            const file = inputElement.files[0];
            if (!file || !activePrivateSocketId) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                socket.emit('send_private_msg', { targetSocketId: activePrivateSocketId, image: base64Img });
                
                privateChatsData[activePrivateSocketId].messages.push({ sender: 'أنت', image: base64Img });
                appendPrivateMessageUI('أنت', null, base64Img, true);
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
